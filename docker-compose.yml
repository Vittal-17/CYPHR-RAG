services:

  backend:
    build:
      context: ./backend
    container_name: cyphr-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: cyphr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
