name: CI Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. FRONTEND: Lint, Test with Coverage, Production Build
  # ===========================================================================
  frontend-qc:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean lockfile)
        run: npm ci

      - name: Check ESLint strictness (zero warnings allowed)
        run: npm run lint

      - name: Run Vitest test suite with V8 coverage
        run: npm run test:coverage

      - name: Build production bundle (Vite)
        run: npm run build

      - name: Archive frontend test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # 2. BACKEND: Security & Enterprise RAG Regression Suite
  # ===========================================================================
  backend-qc:
    name: Backend Security & RAG Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      MONGODB_URI: mongodb://localhost:27017/ci_test_db
      MONGODB_DB_NAME: ci_test_db
      MONGODB_COLLECTION_NAME: documents
      JWT_SECRET_KEY: ci-test-jwt-secret-key-at-least-32-chars-long
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      GOOGLE_CLIENT_ID: mock-google-client-id
      GOOGLE_CLIENT_SECRET: mock-google-client-secret
      GITHUB_CLIENT_ID: mock-github-client-id
      GITHUB_CLIENT_SECRET: mock-github-client-secret
      JINA_API_KEY: mock-jina-api-key
      EMBEDDING_PROVIDER: jina
      JINA_EMBEDDING_MODEL: jina-embeddings-v3
      EMBEDDING_DIMENSIONS: '768'
      GEMINI_API_KEY: mock-gemini-api-key
      GROQ_API_KEY: mock-groq-api-key
      LLM_GEMINI_ENABLED: 'true'
      LLM_GROQ_ENABLED: 'true'
      MAX_PDF_SIZE_MB: '25'
      MAX_PDF_PAGES: '200'
      MAX_CHUNKS_PER_DOCUMENT: '5000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend security and RAG regression tests (168 tests)
        run: python -m unittest verify_security.py

  # ===========================================================================
  # 3. DOCKER: Container Buildability Check
  # ===========================================================================
  docker-verification:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: cyphr-backend:ci-check

      - name: Validate Frontend Dockerfile build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_BASE_URL=""
            VITE_GOOGLE_CLIENT_ID="mock-google-client-id"
          tags: cyphr-frontend:ci-check

  # ===========================================================================
  # 4. CI GATE: Unified Branch Protection Status Check
  # ===========================================================================
  ci-gate:
    name: CI Pipeline Status Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - frontend-qc
      - backend-qc
      - docker-verification
    steps:
      - name: Evaluate upstream pipeline status
        run: |
          echo "Evaluating pipeline status across all jobs..."
          echo "Frontend QC: ${{ needs.frontend-qc.result }}"
          echo "Backend QC:  ${{ needs.backend-qc.result }}"
          echo "Docker:      ${{ needs.docker-verification.result }}"

          if [ "${{ needs.frontend-qc.result }}" != "success" ] || \
             [ "${{ needs.backend-qc.result }}" != "success" ] || \
             [ "${{ needs.docker-verification.result }}" != "success" ]; then
            echo "ERROR: One or more critical CI jobs failed or were cancelled."
            exit 1
          fi

          echo "SUCCESS: All CI quality, security, and container checks passed successfully."
